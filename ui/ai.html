<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营AI</title><link rel="stylesheet" href="ai.css"></head><body><div id="app"><aside><h2>会话</h2><button id="new">＋ 新会话</button><div id="threads"></div><button id="notes">独立记忆</button><button id="files">业务文件</button><p>会话和经营资料自动保存</p></aside><main><header><div><h2 id="title">独立运营助手</h2><span id="status">正在连接…</span></div><div id="thread-actions"></div></header><div id="activity" class="activity" role="status" aria-live="polite"></div><div id="sync-state" class="sync-state"></div><div id="error" role="alert"></div><section id="content"><div class="welcome"><h1>有什么经营问题需要分析？</h1><p>可分析本店数据、整理运营计划和维护独立业务记忆。</p><p>不访问电脑、网盘或其他助手的文件与记忆。</p></div></section><section id="compose"><textarea id="message" placeholder="询问销售、刊登问题或业务计划…" maxlength="12000" rows="3"></textarea><div><span>修改商品前会请你核对确认</span><button id="send" type="button">发送</button><button id="stop" type="button" hidden>停止</button></div></section></main></div><script src="human-report.js"></script><script src="ai.js"></script></body></html>
