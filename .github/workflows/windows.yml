name: Windows client
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[docs-only]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare-assets
      - run: node -e "if (require('./package.json').version !== require('./shared/protocol.cjs').VERSION) process.exit(1)"
      - run: npm test
      - run: node --test test/sku-lists.test.cjs
      - run: node test/publication-status.test.cjs
      - run: node test/continuation.test.cjs
      - run: ./scripts/seed-builder-cache.ps1
        shell: pwsh
      - run: npm run build:win -- "--config.electronDist=$env:EDUP_VERIFIED_ELECTRON_ZIP"
        shell: pwsh
        env:
          DEBUG: electron-builder
      - name: Verify signed application patches and rollback without an installer
        run: |
          node test/patch-electron-smoke.cjs node_modules/electron/dist/electron.exe
      - name: Verify saved-batch continuation and material editing without user data
        run: node test/run-native-continuation.cjs
      - name: Verify GIGA browser pre-step without user data or supplier writes
        run: node test/run-native-giga-browser.cjs
      - name: Build application-only patch artifact
        run: node scripts/build-app-patch.cjs
      - name: Verify overwrite install and protected Windows storage on isolated runner
        shell: pwsh
        run: ./test/windows-upgrade.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/windows-upgrade-receipt.json
            dist/*.eduppatch
            dist/*.eduppatch.json
            dist/patch-electron-receipt.json
            dist/native-continuation-receipt.json
            dist/native-giga-browser-receipt.json
      - name: Publish new version without replacing existing releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = node -p "require('./package.json').version"
          gh release view "v$releaseVersion" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Version exists; release assets are immutable.'; exit 0 }
          Get-FileHash "dist/EDUPLINK-Setup-$releaseVersion.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  EDUPLINK-Setup-$releaseVersion.exe" } | Set-Content -Encoding utf8 dist/SHA256SUMS.txt
          gh release create "v$releaseVersion" "dist/EDUPLINK-Setup-$releaseVersion.exe" "dist/EDUPLINK-App-$releaseVersion.eduppatch" "dist/EDUPLINK-App-$releaseVersion.eduppatch.json" dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "自用版本 v$releaseVersion" --notes-file RELEASE-NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
